[project]
name = "sign-language-interpretation"
version = "0.1.0"
description = "Sign Language Interpretation API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.26.0",
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "backend.main:app"
